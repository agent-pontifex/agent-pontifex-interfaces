name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.91.0
      - name: Install Node.js 22 for the TypeSpec compiler
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate JSON syntax
        run: jq -e empty schemas/*.json conformance/fixtures/*.json
      - name: Compile the independently authored TypeSpec authority
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/typespec" \
            --ignore-scripts --no-audit --no-fund \
            @typespec/compiler@1.15.0
          "$RUNNER_TEMP/typespec/node_modules/.bin/tsp" compile \
            typespec/main.tsp --no-emit
      - name: Compile Rust contract gates with warnings denied
        run: |
          set -euo pipefail
          mkdir -p target/contract-tools
          rustc --edition=2024 -D warnings \
            tools/check-peer-parity.rs \
            -o target/contract-tools/check-peer-parity
          rustc --edition=2024 -D warnings \
            tools/run-conformance.rs \
            -o target/contract-tools/run-conformance
          rustc --edition=2024 -D warnings --test \
            tools/run-conformance.rs \
            -o target/contract-tools/run-conformance-tests
      # Fail closed: TypeSpec and JSON Schema are co-equal authorities. Any
      # unexplained divergence blocks publication, merge, release and deployment.
      - name: Peer authority parity
        run: target/contract-tools/check-peer-parity .
      - name: Contract-gate unit tests
        run: target/contract-tools/run-conformance-tests
      - name: Contract conformance
        run: target/contract-tools/run-conformance .

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Type-check with the pinned TypeScript compiler
        working-directory: typescript
        run: npx --yes --package typescript@5.9.2 tsc -p tsconfig.json --noEmit

  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the Dart SDK
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - name: Resolve and analyze the Dart projection
        working-directory: dart
        run: |
          set -euo pipefail
          dart pub get
          dart analyze --fatal-infos
