name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
      # Fail closed: TypeSpec and JSON Schema are co-equal authorities. Any
      # unexplained divergence blocks publication, merge, release and deployment.
      - name: Peer authority parity
        run: python3 tools/check_peer_parity.py
      - name: Contract conformance
        run: python3 tools/run_conformance.py

  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Type-check with the pinned TypeScript compiler
        working-directory: typescript
        run: npx --yes --package typescript@5.9.2 tsc -p tsconfig.json --noEmit

  dart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the Dart SDK
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - name: Resolve and analyze the Dart projection
        working-directory: dart
        run: |
          set -euo pipefail
          dart pub get
          dart analyze --fatal-infos
